schema_version: "1.1"
name: tulip-react-loader
expected_outcome: |
  origami/tulip.ts exports a build function that folds the traditional tulip flower
  head from a square, following a public diagram, one F.step per diagram step with a
  label in plain words. The skill's fold check passes on it, and the agent looked at
  rendered frames of every step before finishing. The response shows the upload screen
  registering the model with registerModel and rendering <origami-loader model="tulip">,
  setting progress as the upload advances and calling complete() when it is done.
context:
  scaffold_script: place-files.sh
